name: Publish the Host Root

# The bare domain https://beso1227.github.io/ belongs to this repository and
# not to the project: GitHub Pages serves the domain root of an account from
# exactly one repository, the one named after the account, and every other
# repository's site from a sub-path. Deltempo's site is served from
# /Deltempo/, so this repository is what answers for the domain itself.
#
# What it serves:
#
#   index.html    a redirect to the project site, and - the reason this
#                 repository exists - the page a search engine reads to find
#                 the site's icon. Google shows one favicon per hostname and
#                 finds it by crawling the home page of that hostname, which
#                 for this domain is this page. While this repository was
#                 missing, the hostname answered 404, the search engine had
#                 no live page to re-read, and it kept showing the icon it
#                 had cached before the rebrand.
#   robots.txt    the domain-wide crawler policy.
#   sitemap.xml   a sitemap index pointing at the project sitemap.
#   the icons     copies of the project's icons, so the favicon that is
#                 fetched for the hostname is the current one.
#
# Nothing here is hand-maintained. The content lives in the repository that
# owns the site (Beso1227/Deltempo, in site-root/), and this workflow
# regenerates it from there and publishes the result, so the two copies
# cannot disagree.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # The project's icons change when the artwork is redrawn, and the icon
    # this domain serves has to follow. A daily run keeps it in step even if
    # a change lands without a push here.
    - cron: "41 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "host-root"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Beso1227/Deltempo
          ref: main
          path: site-source

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Render the host-root files
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          node site-source/scripts/render_host_root.js --out host-root

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the host root
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'host-root'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
